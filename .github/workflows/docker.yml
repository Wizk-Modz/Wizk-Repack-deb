name: Build, Package & Publish to GitHub Packages

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Build Debian Packages (.deb) cho cả arm64 và amd64
  build-deb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies & ARM64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper debhelper-compat dpkg-dev fakeroot \
            crossbuild-essential-arm64

      - name: Build Debian package cho AMD64 (x86_64)
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          cp ../*.deb dist/
          dh clean

      - name: Build Debian package cho ARM64 (aarch64 / Termux)
        run: |
          dpkg-buildpackage -aarm64 -us -uc -b
          cp ../*arm64.deb dist/
          ls -la dist/

      - name: Upload .deb packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: dist/*.deb

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Wizk Repack v1.0.0
          body: |
            ## Wizk Repack v1.0.0 (C Native)
            Đóng gói Debian package chuẩn cho `wizk-repack` hỗ trợ cả 2 kiến trúc:
            - `wizk-repack_1.0.0_arm64.deb`: Dành cho thiết bị **ARM64 / AArch64 / Termux / Android**.
            - `wizk-repack_1.0.0_amd64.deb`: Dành cho máy tính **x86_64 / PC / Server**.

            ### Docker Container (GitHub Packages):
            - `ghcr.io/${{ github.repository }}:latest` (Multi-arch: `linux/arm64`, `linux/amd64`)
          files: dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 2: Build & Push Docker image Multi-Arch (linux/amd64 & linux/arm64)
  docker-ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (cho multi-arch arm64 + amd64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=1.0.0

      - name: Build and push Multi-arch Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
